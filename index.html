<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD x OFFICIAL | KEY SYSTEM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            /* Dark Blue Background as requested */
            background-color: #0a0b10; color: white; 
            font-family: 'Poppins', sans-serif; overflow: hidden;
            user-select: none;
        }

        #god-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }

        #particles-js { position: absolute; width: 100%; height: 100%; z-index: -1; }

        .glass-card {
            background: rgba(15, 18, 26, 0.8);
            backdrop-filter: blur(15px);
            border: 2px solid #00d4ff; 
            border-radius: 20px; 
            padding: 35px 20px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.2);
            animation: fadeIn 0.6s ease-in-out;
        }

        /* Branding for Page 1 */
        .brand-header {
            font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900;
            color: #a855f7; margin-bottom: 20px; letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .status-title {
            font-family: 'Orbitron', sans-serif;
            color: #00d4ff; font-size: 20px; margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        #key-display-box {
            background: rgba(0,0,0,0.3); 
            border: 2px solid #39ff14; /* Neon Green Border */
            color: #39ff14; padding: 18px; border-radius: 12px;
            font-family: 'Orbitron', sans-serif; font-size: 15px; margin: 20px 0;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
        }

        .copy-btn {
            background: #00d4ff;
            border: none; color: #000; padding: 14px; border-radius: 10px;
            width: 100%; font-family: 'Orbitron', sans-serif;
            font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
            transition: 0.3s;
        }

        .footer-link { 
            position: absolute; bottom: 40px; text-decoration: none; 
            color: #00d4ff; font-weight: bold; font-size: 13px; 
            letter-spacing: 1px; font-family: 'Orbitron', sans-serif;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div id="god-overlay">
    <div id="particles-js"></div>
    
    <div id="step-1" class="glass-card">
        <div class="brand-header">GOD X OFFICAL</div>
        <h2 class="status-title">VERIFICATION</h2>
        <p style="color:#888; font-size: 12px; margin-bottom: 20px;">Complete the check below to continue.</p>
        
        <div style="display: flex; justify-content: center; margin-bottom: 15px;">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAC2NNVI4yPhBH0i_" data-callback="verifySuccess" data-theme="dark"></div>
        </div>
        
        <div id="status-ready" style="display:none; color:#39ff14; font-size: 14px; font-weight: bold;">
            verifycontent
        </div>
    </div>

    <div id="step-2" class="glass-card" style="display:none;">
        <h2 class="status-title" style="font-size: 22px;">Verificação Concluída!</h2>
        <p style="color:#bbb; font-size: 13px;">Sua nova chave foi gerada!</p>
        
        <div id="key-display-box">GODxOFFICAL-2-8PfFS</div>
        
        <button id="action-btn" class="copy-btn" onclick="copyKey()">Copiar Chave</button>
    </div>

    <a href="https://t.me/AnkitHunterModOfficial" class="footer-link">JOIN OFFICIAL TELEGRAM</a>
</div>

<script>
    // Particles setup
    particlesJS('particles-js', { "particles": { "number": { "value": 40 }, "color": { "value": "#00d4ff" }, "opacity": { "value": 0.2 }, "size": { "value": 2 }, "line_linked": { "enable": true, "color": "#00d4ff", "opacity": 0.1 }, "move": { "enable": true, "speed": 0.8 } } });

    function verifySuccess() {
        document.getElementById('status-ready').style.display = 'block';
        setTimeout(() => {
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
        }, 1200);
    }

    function copyKey() {
        const keyText = document.getElementById('key-display-box').innerText;
        navigator.clipboard.writeText(keyText);
        const btn = document.getElementById('action-btn');
        btn.innerText = "COPIADO!";
        btn.style.background = "#39ff14";
        setTimeout(() => { 
            btn.innerText = "Copiar Chave"; 
            btn.style.background = "#00d4ff";
        }, 2000);
    }
</script>
</body>
</html>
