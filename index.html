<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD x OFFICIAL | PREMIUM KEY SYSTEM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; color: white; 
            font-family: 'Poppins', sans-serif; overflow: hidden;
            user-select: none;
        }

        #god-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #particles-js { position: absolute; width: 100%; height: 100%; z-index: -1; }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 40px 20px
            width: 85%; max-width: 400px; text-align: center;
            box-shadow: 0 0 40px rgba(110, 0, 255, 0.2);
            animation: slideUp 0.8s ease-out;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900;
            background: linear-gradient(to right, #fff, #6e00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-premium {
            background: linear-gradient(45deg, #6e00ff, #a000ff);
            border: none; color: white; padding: 16px; border-radius: 15px;
            width: 100%; font-family: 'Orbitron', sans-serif;
            font-weight: bold; cursor: pointer; margin-top: 20px;
            box-shadow: 0 8px 20px rgba(110, 0, 255, 0.3);
        }

        #key-box {
            background: rgba(0,0,0,0.5); border: 1px dashed #00d4ff;
            color: #00ffcc; padding: 20px; border-radius: 12px;
            font-family: monospace; font-size: 18px; margin: 20px 0;
        }

        .tg-btn { margin-top: 25px; text-decoration: none; color: #24A1DE; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        
        #cheat-error { display: none; color: #ff4d4d; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="god-overlay">
    <div id="particles-js"></div>
    <div class="logo-text">GOD X OFFICIAL</div>
    <div style="font-size: 10px; color: #6e00ff; margin-bottom: 25px; letter-spacing: 2px;">AUTHORIZE ACCESS</div>

    <div id="step-1" class="glass-card">
        <div id="cheat-error">
            <h3>⚠️ SECURITY ALERT</h3>
            <p style="font-size:12px; color:#aaa;">Please go back and complete the Caslinks step!</p>
        </div>

        <div id="verify-content">
            <h3 style="margin-top:0;">VERIFICATION</h3>
            <p style="color:#888; font-size: 12px; margin-bottom: 20px;">Complete the check below to continue.</p>
            
            <div style="display: flex; justify-content: center; margin-bottom: 10px;">
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAC2OOULF4WlpGlnu" data-callback="onVerify" data-theme="dark"></div>
            </div>
            
            <div id="loading-box" style="display:none; margin-top:15px; color:#00d4ff; font-weight: bold; font-size: 14px;">
                DECRYPTING... <span id="timer">15</span>s
            </div>

            <button id="gen-btn" class="btn-premium" style="display:none;" onclick="showKey()">GET ACCESS KEY</button>
        </div>
    </div>

    <div id="step-2" class="glass-card" style="display:none;">
        <h3 style="margin-top:0; color:#00ffcc;">KEY GENERATED</h3>
        <p style="color:#888; font-size: 11px;">💥 REAL SHOP KEY GENERATED 💥</p>
        <div id="key-box">LOADING...</div>
        <button id="copy-btn" class="btn-premium" onclick="copyKey()">COPY KEY</button>
        <p style="color:#555; margin-top:20px; font-size: 10px;">REGISTER PARA SUCCESSFULLY</p>
    </div>

    <a href="https://t.me/+Pva19q6Ds4I0OWE1" class="tg-btn" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" width="18" style="margin-right:8px;">
        OFFICIAL TELEGRAM
    </a>
</div>

<script>
    // Particle background
    particlesJS('particles-js', { "particles": { "number": { "value": 60 }, "color": { "value": "#6e00ff" }, "opacity": { "value": 0.3 }, "size": { "value": 2 }, "line_linked": { "enable": true, "color": "#6e00ff", "opacity": 0.2 }, "move": { "enable": true, "speed": 1.5 } } });

    // Referral and Security Check
    window.onload = function() {
        var ref = document.referrer;
        if (performance.navigation.type === 1) { window.location.href = "https://caslinks.com/member/dashboard"; }
        if (ref === "" || ref.indexOf("caslinks.com") === -1) {
            document.getElementById('verify-content').style.display = 'none';
            document.getElementById('cheat-error').style.display = 'block';
        }
    }

    let verified = false;
    const shopKeys = ["GODxOFFICAL-2-8PfFS", "GODxOFFICAL-2-wqShf"];

    function onVerify() {
        document.getElementById('loading-box').style.display = 'block';
        let time = 15;
        let countdown = setInterval(() => {
            time--;
            document.getElementById('timer').innerText = time;
            if(time <= 0) {
                clearInterval(countdown);
                verified = true;
                document.getElementById('loading-box').innerHTML = "SYSTEM READY ✅";
                document.getElementById('gen-btn').style.display = 'block';
            }
        }, 1000);
    }

    function showKey() {
        if(!verified) return;
        const randomKey = shopKeys[Math.floor(Math.random() * shopKeys.length)];
        document.getElementById('key-box').innerText = randomKey;
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
    }

    function copyKey() {
        const text = document.getElementById('key-box').innerText;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copy-btn');
        btn.innerText = "COPIED!";
        btn.style.background = "#00ffcc";
        btn.style.color = "#000";
        setTimeout(() => {
            btn.innerText = "COPY KEY";
            btn.style.background = "linear-gradient(45deg, #6e00ff, #a000ff)";
            btn.style.color = "#fff";
        }, 2000);
    }

    // Anti-Inspect
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };
</script>
</body>
</html>
