<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD x OFFICIAL | PREMIUM KEY SYSTEM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; color: white; 
            font-family: 'Poppins', sans-serif; overflow: hidden;
            user-select: none;
        }

        #god-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #particles-js { position: absolute; width: 100%; height: 100%; z-index: -1; }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid #00d4ff; /* Cyan border as per reference */
            border-radius: 25px; 
            padding: 40px 25px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            animation: slideUp 0.5s ease-out;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900;
            color: #fff; margin-bottom: 5px; letter-spacing: 2px;
        }

        .status-title {
            font-family: 'Orbitron', sans-serif;
            color: #00d4ff; font-size: 22px; margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .btn-premium {
            background: #00d4ff;
            border: none; color: #000; padding: 15px; border-radius: 12px;
            width: 100%; font-family: 'Orbitron', sans-serif;
            font-weight: bold; cursor: pointer; margin-top: 20px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            transition: 0.3s;
        }

        #key-box {
            background: rgba(0,0,0,0.4); 
            border: 2px solid #39ff14; /* Neon Green Border */
            color: #39ff14; padding: 20px; border-radius: 15px;
            font-family: 'Orbitron', sans-serif; font-size: 16px; margin: 20px 0;
            word-wrap: break-word;
            box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.2), 0 0 15px rgba(57, 255, 20, 0.3);
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
        }

        .tg-btn { margin-top: 40px; text-decoration: none; color: #00d4ff; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="god-overlay">
    <div id="particles-js"></div>
    
    <div id="step-1" class="glass-card">
        <h2 class="status-title">VERIFICATION</h2>
        <p style="color:#888; font-size: 13px; margin-bottom: 25px;">Complete the check to continue.</p>
        
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAC2OOULF4WlpGlnu" data-callback="onVerify" data-theme="dark"></div>
        </div>
        
        <div id="loading-box" style="display:none; color:#00d4ff; font-weight: bold;">
            SYSTEM READY ✅
        </div>
    </div>

    <div id="step-2" class="glass-card" style="display:none;">
        <h2 class="status-title">Verificação Concluída!</h2>
        <p style="color:#bbb; font-size: 14px;">Sua nova chave foi gerada!</p>
        
        <div id="key-box">GODxOFFICAL-2-8PfFS</div>
        
        <button id="copy-btn" class="btn-premium" onclick="copyKey()">Copiar Chave</button>
    </div>

    <a href="#" class="tg-btn">JOIN OFFICIAL TELEGRAM</a>
</div>

<script>
    particlesJS('particles-js', { "particles": { "number": { "value": 50 }, "color": { "value": "#00d4ff" }, "opacity": { "value": 0.3 }, "size": { "value": 2 }, "line_linked": { "enable": true, "color": "#00d4ff", "opacity": 0.1 }, "move": { "enable": true, "speed": 1 } } });

    function onVerify() {
        document.getElementById('loading-box').style.display = 'block';
        
        // Success hone ke baad 1.5 second wait karega phir UI change hogi
        setTimeout(() => {
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
        }, 1500);
    }

    function copyKey() {
        const text = document.getElementById('key-box').innerText;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copy-btn');
        btn.innerText = "COPIADO!";
        btn.style.background = "#39ff14";
        setTimeout(() => { 
            btn.innerText = "Copiar Chave"; 
            btn.style.background = "#00d4ff";
        }, 2000);
    }
</script>
</body>
</html>
